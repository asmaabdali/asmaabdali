  $ echo "keep building."

</text>

<text x="650"
      y="515"
      font-family="monospace"
      font-size="12"
      fill="#22D3EE">

  █

  <animate
    attributeName="opacity"
    values="1;0;1"
    dur=".8s"
    repeatCount="indefinite"/>

</text>


<!-- PARTICLES -->

<circle cx="425" cy="120" r="1.5" fill="#22D3EE">

  <animate
    attributeName="opacity"
    values="0;1;0"
    dur="2s"
    repeatCount="indefinite"/>

</circle>

<circle cx="1100" cy="550" r="1.5" fill="#8B5CF6">

  <animate
    attributeName="opacity"
    values="0;1;0"
    dur="3s"
    repeatCount="indefinite"/>

</circle>


</svg>
