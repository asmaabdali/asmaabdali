<svg width="1180" height="610" viewBox="0 0 1180 610"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#8B5CF6"/>
<stop offset="50%" stop-color="#22D3EE"/>
<stop offset="100%" stop-color="#10B981"/>
<animateTransform
attributeName="gradientTransform"
type="translate"
values="0 0;120 0;0 0"
dur="7s"
repeatCount="indefinite"/>
</linearGradient>

<radialGradient id="violet">
<stop offset="0%" stop-color="#7C3AED" stop-opacity=".30"/>
<stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
</radialGradient>

<radialGradient id="cyan">
<stop offset="0%" stop-color="#22D3EE" stop-opacity=".20"/>
<stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
</radialGradient>

<filter id="blur">
<feGaussianBlur stdDeviation="12"/>
</filter>

<filter id="soft">
<feGaussianBlur stdDeviation="4"/>
</filter>

<clipPath id="round">
<rect width="1180" height="610" rx="30"/>
</clipPath>

</defs>


<!-- BACKGROUND -->

<rect width="1180"
height="610"
rx="30"
fill="#030712"/>

<g clip-path="url(#round)">


<!-- AMBIENT LIGHT -->

<circle cx="80" cy="80" r="300"
fill="url(#violet)"
filter="url(#blur)">

<animateTransform
attributeName="transform"
type="translate"
values="0 0;50 30;0 0"
dur="12s"
repeatCount="indefinite"/>

</circle>


<circle cx="1100" cy="530" r="330"
fill="url(#cyan)"
filter="url(#blur)">

<animateTransform
attributeName="transform"
type="translate"
values="0 0;-50 -35;0 0"
dur="14s"
repeatCount="indefinite"/>

</circle>


<!-- BORDER -->

<rect x="1"
y="1"
width="1178"
height="608"
rx="30"
fill="none"
stroke="url(#neon)"
stroke-width="2"
stroke-opacity=".45">

<animate
attributeName="stroke-opacity"
values=".25;.75;.25"
dur="4s"
repeatCount="indefinite"/>

</rect>


<!-- DIVIDER -->

<line x1="440"
y1="70"
x2="440"
y2="540"
stroke="#FFFFFF"
stroke-opacity=".07"/>


