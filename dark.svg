<rect x="490"
      y="445"
      width="85"
      height="32"
      rx="16"
      fill="#7C3AED"
      fill-opacity=".18"
      stroke="#7C3AED"
      stroke-opacity=".5"/>

<text x="510"
      y="466"
      font-family="Arial"
      font-size="12"
      fill="#C4B5FD">

  Python

</text>


<rect x="585"
      y="445"
      width="55"
      height="32"
      rx="16"
      fill="#22D3EE"
      fill-opacity=".14"
      stroke="#22D3EE"
      stroke-opacity=".5"/>

<text x="604"
      y="466"
      font-family="Arial"
      font-size="12"
      fill="#67E8F9">

  AI

</text>


<rect x="650"
      y="445"
      width="55"
      height="32"
      rx="16"
      fill="#10B981"
      fill-opacity=".14"
      stroke="#10B981"
      stroke-opacity=".5"/>

<text x="669"
      y="466"
