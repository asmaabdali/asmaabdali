<svg xmlns="http://www.w3.org/2000/svg"
     width="1180"
     height="610"
     viewBox="0 0 1180 610">

<defs>

  <linearGradient id="accent"
                  x1="0%"
                  y1="0%"
                  x2="100%"
                  y2="100%">

    <stop offset="0%" stop-color="#2563EB"/>
    <stop offset="50%" stop-color="#06B6D4"/>
    <stop offset="100%" stop-color="#10B981"/>

    <animateTransform
      attributeName="gradientTransform"
      type="translate"
      values="0 0;120 0;0 0"
      dur="7s"
      repeatCount="indefinite"/>

  </linearGradient>

  <radialGradient id="blueGlow">

    <stop offset="0%"
          stop-color="#2563EB"
          stop-opacity=".18"/>

    <stop offset="100%"
          stop-color="#2563EB"
          stop-opacity="0"/>

  </radialGradient>

  <radialGradient id="cyanGlow">

    <stop offset="0%"
          stop-color="#06B6D4"
          stop-opacity=".14"/>

    <stop offset="100%"
          stop-color="#06B6D4"
          stop-opacity="0"/>

  </radialGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <filter id="photoGlow">
    <feGaussianBlur stdDeviation="7"/>
  </filter>

  <clipPath id="portraitClip">

    <rect
      x="65"
      y="105"
      width="330"
      height="390"
      rx="25"/>

  </clipPath>

</defs>


<!-- BACKGROUND -->

<rect
  width="1180"
  height="610"
  rx="30"
  fill="#FFFFFF"/>


<!-- BACKGROUND GLOW -->

<circle
  cx="150"
  cy="150"
  r="300"
  fill="url(#blueGlow)"
  filter="url(#blur)">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;40 25;0 0"
    dur="10s"
    repeatCount="indefinite"/>

</circle>


<circle
  cx="1050"
  cy="500"
  r="300"
  fill="url(#cyanGlow)"
  filter="url(#blur)">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;-35 -20;0 0"
    dur="12s"
    repeatCount="indefinite"/>

</circle>


<!-- BORDER -->

<rect
  x="2"
  y="2"
  width="1176"
  height="606"
  rx="30"
  fill="none"
  stroke="url(#accent)"
  stroke-width="2"
  opacity=".45">

  <animate
    attributeName="opacity"
    values=".2;.7;.2"
    dur="4s"
    repeatCount="indefinite"/>

</rect>


<!-- LEFT PHOTO CARD -->

<rect
  x="45"
  y="65"
  width="370"
  height="480"
  rx="30"
  fill="#F8FAFC"
  stroke="#0F172A"
  stroke-opacity=".08"/>


<!-- PHOTO GLOW -->

<rect
  x="65"
  y="105"
  width="330"
  height="390"
  rx="25"
  fill="none"
  stroke="#06B6D4"
  stroke-width="10"
  opacity=".15"
  filter="url(#photoGlow)"/>


<!-- YOUR PHOTO -->

<image
  href="https://raw.githubusercontent.com/asmaabdali/asmaabdali/main/IMG_2292.jpeg"
  x="65"
  y="105"
  width="330"
  height="390"
  preserveAspectRatio="xMidYMid slice"
  clip-path="url(#portraitClip)"
  opacity="0">

  <animate
    attributeName="opacity"
    values="0;0;1"
    keyTimes="0;.25;1"
    dur="3s"
    fill="freeze"/>

  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 5;0 -5;0 5"
    dur="6s"
    repeatCount="indefinite"/>

</image>


<!-- PHOTO OVERLAY -->

<rect
  x="65"
  y="105"
  width="330"
  height="390"
  rx="25"
  fill="url(#accent)"
  opacity=".06"/>


<!-- SCANLINE -->

<rect
  x="65"
  y="105"
  width="330"
  height="3"
  fill="#06B6D4"
  opacity=".45">

  <animate
    attributeName="y"
    values="105;495;105"
    dur="4s"
    repeatCount="indefinite"/>

</rect>


<!-- PHOTO LABEL -->

<rect
  x="85"
  y="455"
  width="185"
  height="30"
  rx="15"
  fill="#FFFFFF"
  fill-opacity=".88"
  stroke="#0F172A"
  stroke-opacity=".08"/>

<text
  x="102"
  y="475"
  font-family="monospace"
  font-size="11"
  fill="#0891B2">

  ASMA // ONLINE

</text>


<!-- DIVIDER -->

<line
  x1="430"
  y1="65"
  x2="430"
  y2="545"
  stroke="#0F172A"
  stroke-opacity=".08"/>


<!-- RIGHT TERMINAL -->

<rect
  x="450"
  y="65"
  width="685"
  height="480"
  rx="30"
  fill="#F8FAFC"
  stroke="#0F172A"
  stroke-opacity=".08"/>


<!-- TERMINAL HEADER -->

<circle cx="485" cy="95" r="6" fill="#CBD5E1"/>
<circle cx="507" cy="95" r="6" fill="#CBD5E1"/>
<circle cx="529" cy="95" r="6" fill="#CBD5E1"/>

<text
