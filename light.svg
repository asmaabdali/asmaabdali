        height="2"
        fill="#06B6D4"
        opacity=".2">

    <animate
      attributeName="y"
      values="50;270;50"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>


  <!-- FLOAT -->

  <animateTransform
    attributeName="transform"
    type="translate"
    values="55 105;55 99;55 105"
    dur="5s"
    repeatCount="indefinite"/>

</g>


