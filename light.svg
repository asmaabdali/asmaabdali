<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#2563EB"/>
    <stop offset="50%" stop-color="#06B6D4"/>
    <stop offset="100%" stop-color="#10B981"/>

    <animateTransform
      attributeName="gradientTransform"
      type="translate"
      values="0 0;80 0;0 0"
      dur="8s"
      repeatCount="indefinite"/>
  </linearGradient>

  <radialGradient id="blueGlow">
    <stop offset="0%" stop-color="#2563EB" stop-opacity=".14"/>
    <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="cyanGlow">
    <stop offset="0%" stop-color="#06B6D4" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
  </radialGradient>

  <clipPath id="rounded">
    <rect width="1180" height="610" rx="30"/>
  </clipPath>

</defs>


<!-- BACKGROUND -->

<rect width="1180"
      height="610"
      rx="30"
      fill="#FFFFFF"/>


<g clip-path="url(#rounded)">


<!-- BACKGROUND GLOW -->

<circle cx="130"
        cy="90"
        r="260"
        fill="url(#blueGlow)">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;35 25;0 0"
    dur="10s"
    repeatCount="indefinite"/>

</circle>


<circle cx="1080"
        cy="500"
        r="300"
        fill="url(#cyanGlow)">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;-40 -25;0 0"
    dur="12s"
    repeatCount="indefinite"/>

</circle>


<!-- BORDER -->

<rect x="1"
      y="1"
      width="1178"
      height="608"
      rx="30"
      fill="none"
      stroke="url(#accent)"
      stroke-width="2"
      stroke-opacity=".35">

  <animate
    attributeName="stroke-opacity"
    values=".2;.6;.2"
    dur="4s"
    repeatCount="indefinite"/>

</rect>


<!-- DIVIDER -->

<line x1="455"
      y1="65"
      x2="455"
      y2="545"
      stroke="#0F172A"
      stroke-opacity=".08"/>


