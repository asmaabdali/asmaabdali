<svg width="1180" height="610" viewBox="0 0 1180 610"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2563EB"/>
    <stop offset="50%" stop-color="#06B6D4"/>
    <stop offset="100%" stop-color="#10B981"/>

    <animateTransform
      attributeName="gradientTransform"
      type="translate"
      values="0 0;120 0;0 0"
      dur="7s"
      repeatCount="indefinite"/>
  </linearGradient>

  <radialGradient id="blueGlow">
    <stop offset="0%" stop-color="#2563EB" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="cyanGlow">
    <stop offset="0%" stop-color="#06B6D4" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
  </radialGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="14"/>
  </filter>

  <filter id="photoGlow">
    <feGaussianBlur stdDeviation="5"/>
  </filter>

  <clipPath id="photoClip">
    <rect x="55" y="105" width="330" height="350" rx="24"/>
  </clipPath>

  <clipPath id="mainClip">
    <rect width="1180" height="610" rx="30"/>
  </clipPath>

</defs>

<!-- BACKGROUND -->

<rect width="1180"
      height="610"
      rx="30"
      fill="#FFFFFF"/>

<g clip-path="url(#mainClip)">

  <!-- BACKGROUND LIGHT -->

  <circle cx="120"
          cy="100"
          r="300"
          fill="url(#blueGlow)"
          filter="url(#blur)">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;40 25;0 0"
      dur="11s"
      repeatCount="indefinite"/>

  </circle>

  <circle cx="1080"
          cy="500"
          r="300"
          fill="url(#cyanGlow)"
          filter="url(#blur)">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;-35 -20;0 0"
      dur="13s"
      repeatCount="indefinite"/>

  </circle>


  <!-- BORDER -->

  <rect x="1"
        y="1"
        width="1178"
        height="608"
        rx="30"
        fill="none"
        stroke="url(#accent)"
        stroke-width="2"
        stroke-opacity=".35">

    <animate
      attributeName="stroke-opacity"
      values=".2;.65;.2"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>


  <!-- PHOTO CARD -->

  <rect x="45"
        y="75"
        width="350"
        height="400"
        rx="28"
        fill="#F8FAFC"
        stroke="#0F172A"
        stroke-opacity=".08"/>


  <!-- PHOTO GLOW -->

  <rect x="55"
        y="105"
        width="330"
        height="350"
        rx="24"
        fill="none"
        stroke="#06B6D4"
        stroke-width="8"
        opacity=".12"
        filter="url(#photoGlow)"/>


  <!-- YOUR PHOTO -->

  <image
    x="55"
    y="105"
    width="330"
    height="350"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#photoClip)"
    href="https://raw.githubusercontent.com/asmaabdali/asmaabdali/main/IMG_2292.jpeg"
    opacity="0">

    <animate
      attributeName="opacity"
      values="0;0;1"
      keyTimes="0;.18;1"
      dur="3s"
      fill="freeze"/>

  </image>


  <!-- PHOTO OVERLAY -->

  <rect x="55"
        y="105"
        width="330"
        height="350"
        rx="24"
        fill="url(#accent)"
        opacity=".06"/>


  <!-- SCANLINE -->

  <rect x="55"
        y="105"
        width="330"
        height="3"
        fill="#06B6D4"
        opacity=".35">

    <animate
      attributeName="y"
      values="105;452;105"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>


  <!-- PHOTO LABEL -->

  <rect x="75"
        y="420"
        width="165"
        height="27"
        rx="13"
        fill="#FFFFFF"
        fill-opacity=".85"
        stroke="#0F172A"
        stroke-opacity=".08"/>

  <text x="90"
        y="439"
        font-family="monospace"
        font-size="11"
        fill="#0891B2">

    ASMA ABDALI // ONLINE

  </text>


  <!-- FLOATING PHOTO -->

  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;0 -5;0 0"
    dur="6s"
    repeatCount="indefinite"/>


  <!-- DIVIDER -->

  <line x1="430"
        y1="65"
        x2="430"
        y2="545"
        stroke="#0F172A"
        stroke-opacity=".08"/>


  <!-- TERMINAL -->

  <rect x="465"
        y="55"
        width="660"
        height="500"
        rx="24"
        fill="#F8FAFC"
        stroke="#0F172A"
        stroke-opacity=".08"/>


  <!-- TERMINAL HEADER -->

  <circle cx="495"
          cy="85"
          r="6"
          fill="#CBD5E1"/>

  <circle cx="517"
          cy="85"
          r="6"
          fill="#CBD5E1"/>

  <circle cx="539"
          cy="85"
          r="6"
          fill="#CBD5E1"/>

  <text x="570"
        y="90"
        font-family="monospace"
        font-size="12"
        fill="#64748B">

    asma@github:~$

  </text>


  <!-- COMMAND -->

  <text x="500"
        y="140"
        font-family="monospace"
        font-size="14"
        fill="#64748B">

    $ ./introduce.sh

  </text>


  <!-- GREETING -->

  <text x="500"
        y="190"
        font-family="Arial"
        font-size="34"
        font-weight="700"
        fill="#0F172A">

    Hi 👋

  </text>


  <text x="500"
        y="235"
        font-family="Arial"
        font-size="38"
        font-weight="700"
        fill="url(#accent)">

    ASMA ABDALI

  </text>


  <!-- TYPING -->

  <text x="500"
        y="270"
        font-family="monospace"
        font-size="15"
        fill="#475569">

    Computer Science Student

    <tspan fill="#06B6D4">█</tspan>

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>

  </text>


  <!-- LINE -->

  <line x1="500"
        y1="300"
        x2="1090"
        y2="300"
        stroke="#0F172A"
        stroke-opacity=".07"/>


  <!-- INFORMATION -->

  <text x="500"
        y="335"
        font-family="monospace"
        font-size="13"
        fill="#64748B">

    EDUCATION

  </text>

  <text x="660"
        y="335"
        font-family="monospace"
        font-size="14"
        fill="#0F172A">

    Computer Science

  </text>


  <text x="500"
        y="370"
        font-family="monospace"
        font-size="13"
        fill="#64748B">

    FOCUS

  </text>

  <text x="660"
        y="370"
        font-family="monospace"
        font-size="14"
        fill="#0891B2">

    Python • Artificial Intelligence

  </text>


  <text x="500"
        y="405"
        font-family="monospace"
        font-size="13"
        fill="#64748B">

    STATUS

  </text>

  <text x="660"
        y="405"
        font-family="monospace"
        font-size="14"
        fill="#059669">

    ● Learning &amp; Building

  </text>


  <!-- SKILLS -->

  <rect x="500"
        y="435"
        width="80"
        height="30"
        rx="15"
        fill="#2563EB"
        fill-opacity=".08"
        stroke="#2563EB"
        stroke-opacity=".30"/>

  <text x="520"
        y="455"
        font-family="Arial"
        font-size="12"
        font-weight="600"
        fill="#2563EB">

    Python

  </text>


  <rect x="590"
        y="435"
        width="55"
        height="30"
        rx="15"
        fill="#06B6D4"
        fill-opacity=".08"
        stroke="#06B6D4"
        stroke-opacity=".30"/>

  <text x="610"
        y="455"
        font-family="Arial"
        font-size="12"
        font-weight="600"
        fill="#0891B2">

    AI

  </text>


  <rect x="655"
        y="435"
        width="55"
        height="30"
        rx="15"
        fill="#10B981"
        fill-opacity=".08"
        stroke="#10B981"
        stroke-opacity=".30"/>

  <text x="674"
        y="455"
        font-family="Arial"
        font-size="12"
        font-weight="600"
        fill="#059669">

    Git

  </text>


  <!-- FOOTER -->

  <text x="500"
        y="510"
        font-family="monospace"
        font-size="12"
        fill="#64748B">

    $ echo "keep building."

  </text>

  <text x="650"
        y="510"
        font-family="monospace"
        font-size="12"
        fill="#06B6D4">

    █

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur=".9s"
      repeatCount="indefinite"/>

  </text>


  <!-- PARTICLES -->

  <circle cx="420"
          cy="80"
          r="1.5"
          fill="#06B6D4">

    <animate
      attributeName="opacity"
      values="0;1;0"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>

  <circle cx="1090"
          cy="520"
          r="1.5"
          fill="#2563EB">

    <animate
      attributeName="opacity"
      values="0;1;0"
      dur="3s"
      repeatCount="indefinite"/>

  </circle>

</g>

</svg>
